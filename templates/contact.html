<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='contact_style.css')}}">
</head>
<body>
    <nav>
            <section class="left">
                <a href="/story">Story</a>
                <a href="/epk">EPK</a>
                <a href="/trailer">Trailer</a>
            </section>
            <section class="center">
                <a href="/" class="logo"><img src="{{url_for('static', filename='A Good Life Logo.png')}}" alt="logo"></a>
            </section>
            <section class="right">
                <a href="/bts">BTS</a>
                <a href="/filmmakers">Filmmakers</a>
                <a href="/contact">Contact Us</a>
            </section>
    </nav>
    <main>
        <h1>Contact Us</h1>
        <h3>We'd love to hear from you - get in touch!</h3>
        <p class="error" id="msg">{{msg}}</p>
        <p class="smsg">{{smsg}}</p>
        <section class="form">
            <form action="/contact" method="POST">
            <label for="name">Name</label><br>
            <input type="text" name="name" id="name" placeholder="John"><br>
            <label for="mail">Email</label><br>
            <input type="email" name="mail" id="mail" placeholder="john@gmail.com"><br>
            <label for="message">Message</label><br>
            <textarea name="message" id="message" placeholder="Type Message"></textarea><br><br>
            <button type="submit">Sent</button>
            <button type="reset">Clear</button>
        </form>
        </section>
    </main>
    <footer>
            <section class="footer1">
                <a href="/" class="logo"><img src="{{url_for('static', filename='A Good Life Logo.png')}}" alt="logo"></a>
            </section>
            <section class="links">
                <h3>Quick Links</h3>
                <section class="qlinks">
                    <ul>
                    <li><a href="/index">Home</a></li>
                    <li><a href="/story">Story</a></li>
                    <li><a href="/epk">EPK</a></li>
                    <li><a href="/trailer">Trailer</a></li>
                </ul>
                <ul>
                    <li><a href="/bts">BTS</a></li>
                    <li><a href="/filmmakers">Filmmakers</a></li>
                    <li><a href="/contact">Contact Us</a></li>
                </ul>
                </section>
            </section>
    </footer>
</body>
</html>
